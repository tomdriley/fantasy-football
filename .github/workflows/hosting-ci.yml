name: Hosting foundation CI

on:
  pull_request:
    paths:
      - .github/workflows/hosting-*.yml
      - .dockerignore
      - hosting/**
      - infra/azure/**
      - scripts/check_hosted_app.py
      - scripts/check_hosting_auth_config.py
      - tests/test_*hosting*.py
      - requirements*.txt
      - requirements.lock
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
        env:
          POSTGRES_PASSWORD: local-test-only
        ports:
          - "127.0.0.1::5432"
        options: >-
          --cpus 1 --memory 512m
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Test the foundation against isolated PostgreSQL
        env:
          FFOPT_TEST_POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
        run: |
          test -n "$FFOPT_TEST_POSTGRES_PORT"
          python -m pip install -r requirements-dev.txt -c requirements.lock
          python -m unittest discover -s tests -p 'test_*hosting*.py'
      - name: Compile Azure templates without Azure credentials
        run: |
          az bicep install --version v0.47.16
          az bicep build --file infra/azure/main.bicep --stdout > /dev/null
          az bicep build --file infra/azure/bootstrap.bicep --stdout > /dev/null
          az bicep build --file infra/azure/stage-auth.bicep --stdout > /dev/null
          az bicep build --file infra/azure/stage-auth-settings.bicep --stdout > /dev/null
          bash -n infra/azure/check-image.sh infra/azure/deploy-stage.sh
      - name: Build and smoke-test the non-root container without publication
        run: |
          docker build --platform linux/amd64 --provenance=false --sbom=false \
            -f hosting/Dockerfile --build-arg "RELEASE=$GITHUB_SHA" \
            -t hosting-foundation:ci .
          bash infra/azure/check-image.sh hosting-foundation:ci "$GITHUB_SHA"
      - name: Save the private manual candidate for layer review
        if: github.event_name == 'workflow_dispatch' && github.event.repository.private == true
        shell: bash
        run: |
          umask 077
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          image_id=$(docker image inspect hosting-foundation:ci --format '{{.Id}}')
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          review_dir="$RUNNER_TEMP/hosting-candidate-review"
          mkdir "$review_dir"
          docker image save hosting-foundation:ci --output "$review_dir/image.tar"
          printf '%s\n' "$GITHUB_SHA" > "$review_dir/release.txt"
          printf '%s\n' 'hosting-foundation:ci' > "$review_dir/reference.txt"
          printf '%s\n' "$image_id" > "$review_dir/image-id.txt"
      - name: Retain the private candidate without registry publication
        if: github.event_name == 'workflow_dispatch' && github.event.repository.private == true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hosting-candidate-review-${{ github.sha }}
          path: ${{ runner.temp }}/hosting-candidate-review/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
